function openEntry(id){editId=id||null;page='entry';render()};function entry(){let e=state.entries.find(e=>e.id===editId)||{module:selected,date:localDate(now()),minutes:15,notes:''};return `<div class="section">${editId?'✏️ 编辑训练记录':'➕ 手动补录训练'}</div><div class="card"><form id="entryForm" onsubmit="submitEntry(event)"><label class="label">训练模块</label><select class="input" name="module">${MODULES.map(m=>`<option value="${m.id}" ${m.id===e.module?'selected':''}>${m.name}</option>`).join('')}</select><label class="label">训练日期</label><input class="input" type="date" name="date" required value="${escapeHTML(e.date)}"><label class="label">有效训练分钟数（允许小数）</label><input class="input" type="number" name="minutes" min="0.1" max="1440" step="0.1" required value="${e.minutes}"><label class="label">备注（可选）</label><textarea class="input" name="notes" rows="3">${escapeHTML(e.notes)}</textarea><button class="btn full" type="submit">💾 保存记录</button></form><div class="space"></div><button class="btn secondary full" onclick="go('history')">返回历史</button></div>`}
function submitEntry(ev){ev.preventDefault();let f=new FormData(ev.target),v=Number(f.get('minutes'));if(!(v>0&&v<=1440))return alert('请输入0.1至1440分钟');let old=state.entries.find(e=>e.id===editId);let item={id:editId||crypto.randomUUID(),module:f.get('module'),date:f.get('date'),minutes:Math.round(v*10)/10,notes:String(f.get('notes')||''),source:old?.source||'manual',createdAt:old?.createdAt||new Date().toISOString(),editedAt:new Date().toISOString()};if(old){state.entries=state.entries.map(e=>e.id===editId?item:e)}else state.entries.push(item);save();go('history')};function removeEntry(id){if(!confirm('确定删除这条记录？累计进度将同步调整。'))return;state.entries=state.entries.filter(e=>e.id!==id);save();render()}
function download(name,text,mime){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:mime}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}function exportJSON(){download(`pte-timer-backup-${localDate(now())}.json`,JSON.stringify({version:1,entries:state.entries,weeklyFocus:state.weeklyFocus||''},null,2),'application/json')}function exportCSV(){let cols=['date','module','minutes','notes','source'];let rows=[cols,...state.entries.map(e=>cols.map(k=>String(e[k]??'')))];download(`pte-timer-${localDate(now())}.csv`,'\ufeff'+rows.map(r=>r.map(v=>'"'+v.replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}async function importJSON(input){let file=input.files?.[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.entries))throw Error('格式错误');let ids=new Set(state.entries.map(e=>e.id)),count=0;for(let e of data.entries){if(!e.id||!MODULES.some(m=>m.id===e.module)||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||!Number.isFinite(e.minutes)||e.minutes<=0||e.minutes>1440||ids.has(e.id))continue;state.entries.push({...e,notes:String(e.notes||'')});ids.add(e.id);count++}save();notify(`成功导入 ${count} 条记录`)}catch(e){alert('导入失败：请使用PTE Timer导出的JSON文件')}}

function v2home(){let m=dailyTotals(),d=localDate(now()),s=streakInfo(),n=lvl();return `<div class="game-banner"><div class="banner-caption">🏰 KO宝的500小时冒险 · 训练就是经验值</div></div>${character()}<div class="card"><div class="row"><b>🏔️ 500小时成长远征</b><span class="badge-gold">${(hourCount()/500*100).toFixed(1)}%</span></div><div class="big">${hourCount().toFixed(1)} <span class="muted">/ 500h</span></div>${progressBar(hourCount(),500)}<p class="note">每10小时解锁装备 · 每50小时角色进化 · 心愿里程碑奖励</p></div><div class="tiles"><button class="tile" onclick="go('calendar')"><span class="emoji">📅</span><strong>训练日历</strong><span>今日 ${(m[d]||0).toFixed(1)} 分钟 ${(m[d]||0)>=30?'👑':''}</span></button><button class="tile" onclick="go('calendar')"><span class="emoji">🔥</span><strong>连续训练</strong><span>${s.current} 天 · 最长 ${s.best} 天</span></button><button class="tile" onclick="go('equipment')"><span class="emoji">⚔️</span><strong>装备收藏</strong><span>当前 Lv.${n} / 50</span></button><button class="tile" onclick="go('goals')"><span class="emoji">🎁</span><strong>心愿宝箱</strong><span>8个重要里程碑</span></button></div><div class="space"></div><button class="btn full" onclick="go('train')">▶ 开始英语训练</button><div class="space"></div><button class="btn secondary full" onclick="openEntry()">＋ 手动补录 / 调整训练时间</button>`}

function equipment(){let l=lvl(),levels=gearLevels();return `<div class="section">⚔️ KO宝的装备图鉴</div>${character()}<div class="card"><b>当前装备 · Lv.${l}</b><p class="note">每10小时解锁一件装备并显示奖励卡片；每50小时KO宝切换一张完整角色插画。</p>${gearGrid()}</div><div class="card"><b>📜 最近及未来升级路线</b>${Array.from({length:Math.min(50,Math.max(10,l+5))},(_,i)=>i+1).slice(Math.max(0,l-5),Math.min(50,Math.max(10,l+5))).map(n=>{let idx=(n-1)%6,rank=Math.ceil(n/6),name=GEAR_TRACKS[idx][Math.min(rank-1,GEAR_TRACKS[idx].length-1)];return `<div class="game-row"><span class="reward-icon">${GEAR_ICONS[idx]}</span><div style="flex:1"><b>${n*10}小时 · ${name}</b><div class="mini">${GEAR_NAMES[idx]} Lv.${rank}</div></div><span>${l>=n?'✅':'🔒'}</span></div>`}).join('')}</div><div class="card"><b>🏆 特殊装备收藏</b>${REWARD_HOURS.map(h=>`<div class="game-row"><span class="reward-icon">${hourCount()>=h?'🎖️':'🔒'}</span><div>${h}小时 · ${escapeHTML(game.special[h]||'尚未选择')}</div></div>`).join('')}</div>`}
function calendar(){let today=localDate(now()),ym=game.calendarMonth||today.slice(0,7),[y,mo]=ym.split('-').map(Number),first=new Date(y,mo-1,1).getDay(),days=new Date(y,mo,0).getDate(),m=dailyTotals(),s=streakInfo(),selectedDate=game.calendarSelected||today,selectedMinutes=m[selectedDate]||0,rr=rescueState(today,m),yesterday=addDays(today,-1);let cells=Array.from({length:first},()=>'<div class="daycell empty"></div>');for(let i=1;i<=days;i++){let d=`${ym}-${String(i).padStart(2,'0')}`,v=m[d]||0,crown=v>=30,rescued=v<30&&completedDay(d,m);cells.push(`<button class="daycell ${crown?'crowned':rescued?'rescued':v>0?'active':''} ${d===selectedDate?'selected':''} ${d>today?'future':''}" onclick="selectCal('${d}')"><b>${i}</b><small>${crown?'<span class="crown">👑</span>':rescued?'🛡️':v>0?'🐾':'·'}<span class="cal-minutes">${v>0?`${Number(v.toFixed(1))}分`:'—'}</span></small></button>`)}return `<div class="section">📅 KO宝训练日历</div><div class="card"><div class="row"><button class="btn secondary small" onclick="shiftCal(-1)">‹</button><b>${y}年${mo}月</b><button class="btn secondary small" onclick="shiftCal(1)">›</button></div><div class="calendar-grid" style="margin-top:13px">${['日','一','二','三','四','五','六'].map(x=>`<div style="text-align:center" class="mini">${x}</div>`).join('')}${cells.join('')}</div><p class="note">👑 当天累计≥30分钟 · 🛡️ 次日补救成功 · 绿色表示有训练</p></div><div class="card"><b>${selectedDate} · ${selectedMinutes.toFixed(1)}分钟</b><p class="note">${selectedMinutes>=30?'👑 获得当日金冠':completedDay(selectedDate,m)?'🛡️ 已通过次日补救维持连续训练':selectedMinutes>0?'继续努力，达到30分钟可获金冠':'当天暂无训练'}</p>${state.entries.filter(e=>e.date===selectedDate).map(e=>`<div class="mini">${escapeHTML(e.module)} · ${Number(e.minutes).toFixed(1)}分钟</div>`).join('')}<button class="btn secondary small" onclick="go('history')" style="margin-top:10px">查看／修改记录</button></div><div class="card"><div class="row"><b>🔥 当前连续训练</b><span class="streak-number">${s.current}天</span></div><div class="note">历史最长：${s.best}天 · 正常达标为每天30分钟</div>${(m[yesterday]||0)<30?`<div class="alert">🛡️ 昨天训练 ${(m[yesterday]||0).toFixed(1)} 分钟。今天累计 ${rr.required.toFixed(1)} 分钟，可补救昨天的连续记录；今天已完成 ${(m[today]||0).toFixed(1)} 分钟。${rr.canRescue?'已达成补救条件！':'还需 '+Math.max(0,rr.required-(m[today]||0)).toFixed(1)+' 分钟'}</div>`:''}<p class="note">补救不虚增训练时长；只修复连续天数。修改历史记录后重新计算。</p></div>`}
function shiftCal(n){let ym=game.calendarMonth||localDate(now()).slice(0,7),[y,m]=ym.split('-').map(Number),d=new Date(y,m-1+n,1);game.calendarMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;game.calendarSelected='';saveGame();render()}
function selectCal(d){game.calendarSelected=d;saveGame();render()}
function updateWish(h,value){game.wishes[h]=value;saveGame()}

function v2goals(){let h=hourCount();return `<div class="section">🏰 500小时目标与心愿宝箱</div>${character()}<div class="card"><div class="row"><b>500小时远征进度</b><b>${h.toFixed(1)} / 500h</b></div>${progressBar(h,500)}</div>${REWARD_HOURS.map((n,i)=>{let m=MILESTONES.find(x=>x.h===n),unlocked=h>=n;return `<div class="card"><div class="row"><span style="font-size:30px">${unlocked?'🎁':'🔒'}</span><div style="flex:1"><b>${n}小时 · ${m?.name||'成长里程碑'}</b><div class="note">${m?.goal||'积累刻意训练，保持表达练习。'}</div></div><span class="badge-gold">${unlocked?'已解锁':'未解锁'}</span></div><label class="label" style="display:block;margin-top:12px">🎀 我的现实心愿</label><input class="input wish-input" maxlength="180" placeholder="写下达成目标后送给自己的奖励" value="${escapeHTML(game.wishes[n]||'')}" oninput="updateWish(${n},this.value)" onchange="updateWish(${n},this.value)"><label class="choice"><input type="checkbox" ${game.claimed[n]?'checked':''} ${!unlocked?'disabled':''} onchange="claimWish(${n},this.checked)"> 我已兑现这个心愿</label><b style="font-size:13px">⚔️ 选择一件特殊装备 ${unlocked?'':'（达标后开放）'}</b>${SPECIAL_OPTIONS[i].map(v=>`<label class="choice"><input type="radio" name="special${n}" ${game.special[n]===v?'checked':''} ${!unlocked?'disabled':''} onchange="chooseSpecial(${n},'${v}')"> ${escapeHTML(v)}</label>`).join('')}</div>`}).join('')}<div class="alert">里程碑能力目标是训练方向，并非达标后自动获得的能力认证。奖励和心愿存于本机，可通过V2完整JSON备份。</div>`}
goals=v2goals;
const oldProgress=progress;progress=function(){let s=streakInfo(),m=dailyTotals(),today=localDate(now());return `<div class="card"><div class="row"><b>👑 今日金冠</b><b>${(m[today]||0).toFixed(1)} / 30分钟</b></div>${progressBar(m[today]||0,30)}<p class="note">🔥 当前连续${s.current}天 · 历史最长${s.best}天</p><button class="btn secondary full" onclick="go('calendar')">📅 打开训练日历</button></div>`+oldProgress()};
const oldHistory=history;history=function(){return oldHistory()+`<div class="card"><b>🛡️ V2 安全备份</b><p class="note">导出完整V1训练记录、游戏装备选择、心愿及设置。请保存到iCloud Drive。</p><button class="btn full" onclick="exportV2()">⬇ 导出V2完整备份</button><p class="note">从V2备份恢复游戏设置（先预览确认，训练记录按ID合并）。</p><input class="fileinput" type="file" accept=".json,application/json" onchange="importV2(this)"></div>`};
function exportV2(){download(`pte-timer-v2-full-${localDate(now())}.json`,JSON.stringify({version:2,exportedAt:new Date().toISOString(),v1:state,game:game},null,2),'application/json')}
async function importV2(input){let f=input.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.version!==2||!d.v1||!Array.isArray(d.v1.entries)||!d.game||typeof d.game!=='object')throw Error('文件格式不正确');let valid=d.v1.entries.filter(e=>e&&typeof e.id==='string'&&MODULES.some(m=>m.id===e.module)&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&Number.isFinite(e.minutes)&&e.minutes>0&&e.minutes<=1440),ids=new Set(state.entries.map(e=>e.id)),newItems=valid.filter(e=>!ids.has(e.id));if(!confirm(`备份包含 ${valid.length} 条有效训练记录，其中 ${newItems.length} 条尚未存在。是否合并这些记录，并恢复备份中的心愿和装备选择？\n\n建议先导出当前V2完整备份。`))return;let before=JSON.stringify(state),gameBefore=JSON.stringify(game);try{state.entries.push(...newItems);save();game={wishes:d.game.wishes&&typeof d.game.wishes==='object'?d.game.wishes:{},special:d.game.special&&typeof d.game.special==='object'?d.game.special:{},claimed:d.game.claimed&&typeof d.game.claimed==='object'?d.game.claimed:{}};saveGame()}catch(err){localStorage.setItem(KEY,before);localStorage.setItem(GAME_KEY,gameBefore);throw err}detectRewards();notify(`恢复成功：新增 ${newItems.length} 条记录`)}catch(err){alert('V2备份导入失败：'+err.message)}finally{input.value=''}}
const oldNav=nav;nav=function(){const tabs=[['home','🏠','首页'],['train','⏱️','训练'],['calendar','📅','日历'],['equipment','⚔️','装备'],['goals','🎁','目标']];$('nav').innerHTML=tabs.map(([id,icon,label])=>`<button class="nav ${page===id?'active':''}" onclick="go('${id}')"><i>${icon}</i>${label}</button>`).join('')};

const GEAR_ASSET_NAMES=['weapon','shield','backpack','boots','helmet','armor'];
function paperDoll(){const levels=gearLevels();const ordered=[2,3,5,4,1,0];const layers=ordered.filter(i=>levels[i]>0).map(i=>`<img class="gear-overlay" alt="" aria-hidden="true" src="assets/equipment/${GEAR_ASSET_NAMES[i]}-${Math.min(9,levels[i])}.svg">`).join('');return `<div class="paperdoll" aria-label="KO宝实时装备形象"><img class="base" src="assets/koda-stage-0.webp" alt="KO宝黑白哈士奇、蓝围巾与指南针">${layers}<span class="equip-glint">✦</span></div>`}

gearGrid=function(){let a=gearLevels();return `<div class="game-grid">${GEAR_NAMES.map((n,i)=>`<div class="gear-slot"><span class="gear-icon">${GEAR_ICONS[i]}</span><b>${n} · Lv.${a[i]}</b><div>${a[i]?GEAR_TRACKS[i][Math.min(a[i]-1,GEAR_TRACKS[i].length-1)]:'未解锁'}</div><div class="gear-rank">${a[i]?`下一等级：${Math.min(9,a[i]+1)}`:'等待解锁'}</div></div>`).join('')}</div>`};
const _v21Home=v2home;v2home=function(){return _v21Home()+`<div class="card"><div class="section" style="margin-top:0">📚 更多功能</div><div class="more-links"><button class="btn secondary" onclick="go('progress')">📊 进度统计</button><button class="btn secondary" onclick="go('playbook')">📖 训练策略</button><button class="btn secondary" onclick="go('history')">📜 历史记录</button><button class="btn secondary" onclick="openEntry()">➕ 手动补录</button></div><p class="note">历史记录支持添加、修改和删除；所有成长奖励实时随有效训练时长更新。</p></div>`};

// Upgrade events: computed from recorded time; do not mutate historical records.
function awardForLevel(n){let idx=(n-1)%6,rank=Math.ceil(n/6),file=['weapon','shield','backpack','boots','helmet','armor'][idx];return {n,name:GEAR_TRACKS[idx][Math.min(rank-1,GEAR_TRACKS[idx].length-1)],category:GEAR_NAMES[idx],file:`assets/equipment/${file}-${Math.min(rank,9)}.svg`}}
function rewardOverlay(){let root=document.getElementById('rewardOverlay');if(!root)return;let pending=Array.isArray(game.pendingRewards)?game.pendingRewards:[];let n=pending[0];if(!n){root.innerHTML='';return}let r=awardForLevel(n);root.innerHTML=`<div class="reward-modal"><div class="reward-panel" role="dialog" aria-modal="true" aria-label="装备升级"><div style="font-size:35px">✨ ⚔️ ✨</div><div class="reward-title">装备升级！</div><p>KO宝达到 Lv.${n} · 累计${n*10}小时</p><img class="reward-art" src="${r.file}" alt="${r.name}"><h2>${r.category}：${r.name}</h2><p>${n%5===0?'🏰 KO宝的角色形象也完成一次进化！':'继续练习，解锁下一件装备。'}</p><button class="btn" onclick="dismissReward()">太棒了！</button></div></div>`}
function dismissReward(){if(!Array.isArray(game.pendingRewards))game.pendingRewards=[];game.pendingRewards.shift();saveGame();rewardOverlay()}
function detectRewards(){let current=lvl();let seen=Number.isInteger(game.lastSeenLevel)?game.lastSeenLevel:null;if(seen===null){game.lastSeenLevel=current;saveGame();return}if(current>seen){let q=Array.isArray(game.pendingRewards)?game.pendingRewards:[];for(let n=seen+1;n<=current;n++)if(!q.includes(n))q.push(n);game.pendingRewards=q.slice(-50)}game.lastSeenLevel=current;saveGame()}
const originalRenderV22=render;render=function(){originalRenderV22();rewardOverlay()};
// Deliberately initialize existing accounts without retroactively spamming 50 unlock dialogs.
if(!Number.isInteger(game.lastSeenLevel)){game.lastSeenLevel=lvl();saveGame()}
const oldSaveV22=save;
// V1 `save` is a const and cannot be reassigned; intercept explicit entry/timer actions instead.
const oldSubmitEntryV22=submitEntry;submitEntry=function(ev){oldSubmitEntryV22(ev);detectRewards();rewardOverlay()};
const oldFinishTimerV22=finishTimer;finishTimer=function(){oldFinishTimerV22();detectRewards();rewardOverlay()};
