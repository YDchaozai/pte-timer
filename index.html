solid white;box-shadow:0 4px 0 #afc4c7;min-height:118px;text-align:left;color:#193952}.tile strong{display:block;margin:8px 0 4px;font-size:15px}.tile span{font-size:12px}.tile .emoji{font-size:27px}.btn{border:0;background:#169f90;color:white;padding:14px 17px;border-radius:15px;font-weight:800;box-shadow:0 4px 0 #11766d}.btn.secondary{background:#fff7e6;color:#30566b;box-shadow:0 4px 0 #c7d6d3}.btn.danger{background:#d46e64;box-shadow:0 4px 0 #a64c45}.btn.small{padding:9px 12px;font-size:12px;box-shadow:none}.full{width:100%}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:530px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);padding:10px 5px calc(10px + env(safe-area-inset-bottom));background:#fffdf5f5;border-top:2px solid #e3e6d8;z-index:10}.nav{border:0;background:transparent;color:#688093;font-size:10px;padding:3px}.nav i{display:block;font-size:21px;font-style:normal;margin-bottom:4px}.nav.active{color:#008f86;font-weight:900}.hide{display:none!important}.milestones{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.milestone{text-align:center;border-radius:15px;background:#edf5eb;padding:10px 5px;border:2px solid #fff}.milestone.locked{filter:grayscale(1);opacity:.58}.milestone .emoji{font-size:30px}.timer{font-size:57px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;margin:14px 0}.ring{width:225px;height:225px;margin:14px auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#2abca5 var(--pct),#e0ebec 0);padding:13px}.ring-inner{background:#fffaf1;border-radius:50%;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}.input{width:100%;border:1.5px solid #cadbdc;border-radius:12px;background:#fff;padding:12px;margin:5px 0 13px;color:#23465b}.label{font-size:13px;font-weight:800}.entry{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid #e5e8df}.entry:last-child </style></head><body><div class="app"><header class="top"><div><div class="brand">🐾 PTE Timer</div><div class="sub">KO宝陪你探索 500 小时英语成长之旅</div></div><span class="pill" id="dateBadge"></span></header><main id="content"></main><nav class="bottom" id="nav"></nav></div><script>
const KEY='pte_timer_v1';const MODULES=[{id:'Quiz',name:'Quiz',icon:'🧠',color:'#eee0ff',desc:'15分钟专项口语测验'},{id:'Active Dialogue',name:'Active Dialogue',icon:'💬',color:'#d7f4e7',desc:'真实情境与互动表达'},{id:'Recording Analysis',name:'Recording Analysis',icon:'🎙️',color:'#ffedce',desc:'录音复盘与语言分析'},{id:'Special Training',name:'Special Training',icon:'🎯',color:'#e7e5ff',desc:'语法、搭配与专项强化'}];
const MILESTONES=[{h:25,icon:'🌱',name:'训练习惯建立',goal:'稳定完成15分钟训练；能用简短结构表达观点并识别常见错误。'},{h:50,icon:'⭐',name:'基础表达自动化',goal:'更快调用常用交易沟通句块，减少明显的冠词、介词和搭配错误。'},{h:100,icon:'🧭',name:'清晰表达进阶',goal:'能较稳定地先讲结论、再解释风险与下一步；缩短冗长铺垫。'},{h:150,icon:'🏕️',name:'现场应对能力',goal:'面对追问、打断和事实变化，练习清楚重启句子并自然回应。'},{h:300,icon:'🏔️',name:'高级沟通能力',goal:'在复杂交易讨论中更自然地提出判断、权衡方案并推动决策。'},{h:500,icon:'🏰',name:'500小时远征完成',goal:'争取实现地道、清晰、自然、有见解但简单的专业口语；以实际录音和盲测评分检验。'}];
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{};if(!state||!Array.isArray(state.entries))state={entries:[],timer:{mode:'idle',module:'Quiz',started:null,accum:0},dailyGoal:15};let page='home',selected='Quiz',editId=null,flash='';const $=id=>document.getElementById(id);const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const now=()=>Date.now();const mins=e=>Number(e.minutes)||0;const sum=arr=>arr.reduce((a,e)=>a+mins(e),0);const total=()=>sum(state.entries);const format=n=>{n=Math.max(0,Math.floor(n));return `${String(Math.floor(n/3600)).padStart(2,'0')}:${String(Math.floor(n%3600/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`};const localDate=d=>{let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const activeMs=()=>state.timer.accum+(state.timer.mode==='running'?Math.max(0,now()-state.timer.started):0);const notify=s=>{flash=s;render();setTimeout(()=>{flash='';render()},2500)};function go(p){page=p;render();window.scrollTo(0,0)}
function nav(){const tabs=[['home','🏠','首页'],['train','⏱️','训练'],['progress','📊','进度'],['goals','🗺️','目标'],['playbook','📖','策略']];$('nav').innerHTML=tabs.map(([id,icon,label])=>`<button class="nav ${page===id?'active':''}" onclick="go('${id}')"><i>${icon}</i>${label}</button>`).join('')}
function progressBar(value,max){return `<div class="progress"><div class="fill" style="width:${Math.min(100,Math.max(0,value/max*100))}%"></div></div>`}
function home(){let hours=total()/60,next=MILESTONES.find(m=>m.h>hours);return `<div class="hero"><img src="assets/koda-adventure.webp" alt="背着冒险背包、系蓝围巾和指南针的KO宝"><div class="bubble">汪！今天也一起向500小时出发！🐾</div></div><div class="card"><div class="row"><b>🏔️ 500小时大冒险</b><span class="pill">${(hours/500*100).toFixed(2)}%</span></div><div class="big">${hours.toFixed(1)} <span class="muted">/ 500 小时</span></div>${progressBar(hours,500)}<p class="muted">${next?`下一站：${next.h}小时 · ${next.name}`:'🎉 已完成全部里程碑！'}</p><button class="btn full" onclick="go('goals')">🗺️ 查看KO宝的冒险地图</button></div><div class="row"><div class="section">今日训练</div><span class="muted">目标 ${state.dailyGoal} 分钟</span></div><div class="card"><div class="row"><strong style="font-size:25px">${sum(state.entries.filter(e=>e.date===localDate(now()))).toFixed(1)} 分钟</strong><button class="btn small" onclick="go('train')">▶ 开始训练</button></div>${progressBar(sum(state.entries.filter(e=>e.date===localDate(now()))),state.dailyGoal)}</div><div class="section">四大训练营地</div><div class="tiles">${MODULES.map(m=>`<button class="tile" style="background:${m.color}" onclick="selected='${m.id}';go('train')"><div class="emoji">${m.icon}</div><strong>${m.name}</strong><span>${(sum(state.entries.filter(e=>e.module===m.id))/60).toFixed(1)}小时 · ${state.entries.filter(e=>e.module===m.id).length}次</span></button>`).join('')}</div><div class="card"><div class="row"><b>📜 训练记录</b><button class="btn secondary small" onclick="go('history')">查看 / 补录 / 修改</button></div><p class="muted">所有计时和手动记录均汇总至500小时进度。</p></div>`}
function train(){let t=state.timer,ms=activeMs(),isQuiz=t.module==='Quiz',pct=Math.min(100,ms/(15*60000)*100);return `<div class="section">⛺ 选择训练营地</div><div class="tiles">${MODULES.map(m=>`<button class="tile" style="background:${m.color};outline:${t.module===m.id?'3px solid #17a08d':'none'}" onclick="choose('${m.id}')"><div class="emoji">${m.icon}</div><strong>${m.name}</strong><span>${m.desc}</span></button>`).join('')}</div><div class="card"><div class="row"><b>${MODULES.find(m=>m.id===t.module).icon} ${t.module}</b><span class="pill">${t.mode==='running'?'🟢 训练中':t.mode==='paused'?'⏸ 已暂停':'准备开始'}</span></div><div class="ring" id="timerRing" style="--pct:${isQuiz?pct:0}%"><div class="ring-inner"><div class="timer" id="timerDisplay">${format(ms/1000)}</div><span class="muted">${isQuiz?'15分钟 Session · 达标继续计时':'自由计时'}</span></div></div><div class="row" style="gap:8px">${t.mode==='idle'?'<button class="btn full" onclick="startTimer()">▶ 开始训练</button>':`<button class="btn secondary full" onclick="${t.mode==='running'?'pauseTimer()':'resumeTimer()'}">${t.mode==='running'?'⏸ 暂停':'▶ 继续'}</button><button class="btn danger full" onclick="finishTimer()">■ 结束保存</button>`}</div><div class="alert">⏱️ 使用真实时间戳。切换App或锁屏后可恢复；忘记暂停可在历史记录里修改。计时进行中请不要清除浏览器数据。</div><button class="btn secondary full" onclick="go('history')">✏️ 手动补录 / 修改记录</button></div>`}
function choose(id){if(state.timer.mode!=='idle'&&state.timer.module!==id){alert('请先结束当前训练再切换模块');return}state.timer.module=id;save();render()};function startTimer(){state.timer={mode:'running',module:state.timer.module,started:now(),accum:0};save();render()};function pauseTimer(){if(state.timer.mode!=='running')return;state.timer.accum=activeMs();state.timer.started=null;state.timer.mode='paused';save();render()};function resumeTimer(){if(state.timer.mode!=='paused')return;state.timer.started=now();state.timer.mode='running';save();render()};function finishTimer(){let ms=activeMs(),mod=state.timer.module;if(ms<1000){if(!confirm('训练不足1秒，确定结束吗？'))return}else if(!confirm(`保存 ${mod} 的 ${(ms/60000).toFixed(1)} 分钟训练吗？`))return;if(ms>=1000)state.entries.push({id:crypto.randomUUID(),module:mod,date:localDate(now()),minutes:Math.round(ms/6000)/10,notes:'',source:'timer',createdAt:new Date().toISOString()});state.timer={mode:'idle',module:mod,started:null,accum:0};save();go('history')}
function progress(){let arr=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return {date:localDate(d),day:['日','一','二','三','四','五','六'][d.getDay()],minutes:sum(state.entries.filter(e=>e.date===localDate(d)))}}),max=Math.max(15,...arr.map(x=>x.minutes));return `<div class="section">📊 我的训练进度</div><div class="card"><div class="muted">累计刻意英语训练</div><div class="big">${(total()/60).toFixed(2)} h</div>${progressBar(total()/60,500)}<p class="muted">距离500小时还差 ${Math.max(0,500-total()/60).toFixed(2)} 小时</p></div><div class="card"><div class="row"><b>最近7天</b><b>${sum(state.entries.filter(e=>e.date>=arr[0].date)).toFixed(1)} 分钟</b></div><div class="bars">${arr.map(x=>`<div class="barwrap"><span>${x.minutes?x.minutes.toFixed(0):''}</span><div class="bar" style="height:${x.minutes/max*110}px"></div><span>周${x.day}</span></div>`).join('')}</div></div><div class="card"><b>训练模块统计</b>${MODULES.map(m=>{let n=sum(state.entries.filter(e=>e.module===m.id));return `<div style="margin:15px 0"><div class="row"><span>${m.icon} ${m.name}</span><b>${(n/60).toFixed(2)}h</b></div>${progressBar(n,Math.max(1,total()))}<div class="mini">${state.entries.filter(e=>e.module===m.id).length} 次训练</div></div>`}).join('')}</div><div class="card"><div class="row"><b>📅 历史与编辑</b><button class="btn small" onclick="go('history')">管理记录</button></div></div>`}
function goals(){let h=total()/60;return `<div class="section">🗺️ KO宝的500小时成长地图</div><div class="hero"><img src="assets/koda-adventure.webp" alt="KO宝冒险形象"><div class="bubble">下一座山峰，等我们一起登顶！</div></div><div class="card"><div class="row"><b>🏰 远征总进度</b><b>${h.toFixed(1)} / 500 h</b></div>${progressBar(h,500)}</div>${MILESTONES.map((m,i)=>`<div class="card" style="opacity:${h>=m.h?1:.86}"><div class="row"><div style="font-size:34px">${h>=m.h?m.icon:'🔒'}</div><div style="flex:1"><b>${m.h}小时 · ${m.name}</b><p class="muted" style="line-height:1.6">${m.goal}</p></div></div><div class="mini">${h>=m.h?'🎉 已解锁 · 继续前进':`还差 ${(m.h-h).toFixed(1)} 小时解锁`}</div></div>`).join('')}<div class="alert">能力目标是训练方向，不是时长达到后自动获得的能力认证；请结合录音和Quiz评分判断。</div>`}
function playbook(){return `<div class="section">📖 我的训练作战手册</div><div class="card"><h2>🎯 North Star</h2><p><b>地道 · 清晰 · 自然 · 有见解 · 但简单</b></p><p class="muted">目标是在真实美国交易律师沟通场景中，清楚表达判断、风险和建议，而非追求华丽表达。</p></div>${[['① Grammar & Collocation','优先消除冠词、介词、动词搭配和句式结构中的反复错误。'],['② Chunk Retrieval','高频提取自然、简短的美国交易律师表达，降低现场组织语言的负担。'],['③ Live Formulation','练习在被打断、事实变化或对方pushback时，清楚地重启句子并继续表达。'],['④ Clarity & Judgment','先讲结论，再解释关键原因、风险及建议的下一步。']].map(x=>`<div class="story"><h4>${x[0]}</h4><p>${x[1]}</p></div>`).join('')}<div class="card"><b>⏳ 每日10分钟基础训练法</b><p>2分钟 Error Reflex → 3分钟 Chunk Retrieval → 3分钟 Live Formulation → 2分钟 Immediate Retry。</p><p class="muted">Quiz 可采用15分钟完整Session。冷答与重答分别评分；语法准确性和自然度分别评估。</p></div><div class="card"><b>📝 自定义本周重点</b><textarea class="input" id="weeklyFocus" rows="4" placeholder="输入本周重点...">${escapeHTML(state.weeklyFocus||'')}</textarea><button class="btn full" onclick="state.weeklyFocus=$('weeklyFocus').value;save();notify('本周重点已保存')">保存本周重点</button></div>`}
function history(){return `<div class="section">📜 训练日志</div><div class="row"><button class="btn" onclick="openEntry()">＋ 手动添加</button><button class="btn secondary small" onclick="exportCSV()">⬇ 导出CSV</button><button class="btn secondary small" onclick="exportJSON()">备份JSON</button></div><div class="card"><b>总计 ${(total()/60).toFixed(2)} 小时 · ${state.entries.length} 条记录</b>${[...state.entries].sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||'').localeCompare(a.createdAt||'')).map(e=>`<div class="entry"><div><b>${MODULES.find(m=>m.id===e.module)?.icon||'⏱️'} ${escapeHTML(e.module)}</b><div class="mini">${escapeHTML(e.date)} · ${e.minutes.toFixed(1)}分钟 · ${e.source==='manual'?'手动':'计时'}</div><div class="mini">${escapeHTML(e.notes||'')}</div></div><div style="display:flex;gap:5px"><button class="btn secondary small" onclick="openEntry('${e.id}')">编辑</button><button class="btn danger small" onclick="removeEntry('${e.id}')">删除</button></div></div>`).join('')||'<p class="muted">暂无记录。开始训练或手动补录吧！</p>'}</div><div class="card"><b>📦 数据恢复</b><p class="muted">可导入之前导出的JSON备份。导入将合并不重复的记录，不覆盖已有记录。</p><input class="fileinput" type="file" accept="application/json,.json" onchange="importJSON(this)"></div>`}
function openEntry(id){editId=id||null;page='entry';render()};function entry(){let e=state.entries.find(e=>e.id===editId)||{module:selected,date:localDate(now()),minutes:15,notes:''};return `<div class="section">${editId?'✏️ 编辑训练记录':'➕ 手动补录训练'}</div><div class="card"><form id="entryForm" onsubmit="submitEntry(event)"><label class="label">训练模块</label><select class="input" name="module">${MODULES.map(m=>`<option value="${m.id}" ${m.id===e.module?'selected':''}>${m.name}</option>`).join('')}</select><label class="label">训练日期</label><input class="input" type="date" name="date" required value="${escapeHTML(e.date)}"><label class="label">有效训练分钟数（允许小数）</label><input class="input" type="number" name="minutes" min="0.1" max="1440" step="0.1" required value="${e.minutes}"><label class="label">备注（可选）</label><textarea class="input" name="notes" rows="3">${escapeHTML(e.notes)}</textarea><button class="btn full" type="submit">💾 保存记录</button></form><div class="space"></div><button class="btn secondary full" onclick="go('history')">返回历史</button></div>`}
function submitEntry(ev){ev.preventDefault();let f=new FormData(ev.target),v=Number(f.get('minutes'));if(!(v>0&&v<=1440))return alert('请输入0.1至1440分钟');let old=state.entries.find(e=>e.id===editId);let item={id:editId||crypto.randomUUID(),module:f.get('module'),date:f.get('date'),minutes:Math.round(v*10)/10,notes:String(f.get('notes')||''),source:old?.source||'manual',createdAt:old?.createdAt||new Date().toISOString(),editedAt:new Date().toISOString()};if(old){state.entries=state.entries.map(e=>e.id===editId?item:e)}else state.entries.push(item);save();go('history')};function removeEntry(id){if(!confirm('确定删除这条记录？累计进度将同步调整。'))return;state.entries=state.entries.filter(e=>e.id!==id);save();render()}
function download(name,text,mime){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:mime}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}function exportJSON(){download(`pte-timer-backup-${localDate(now())}.json`,JSON.stringify({version:1,entries:state.entries,weeklyFocus:state.weeklyFocus||''},null,2),'application/json')}function exportCSV(){let cols=['date','module','minutes','notes','source'];let rows=[cols,...state.entries.map(e=>cols.map(k=>String(e[k]??'')))];download(`pte-timer-${localDate(now())}.csv`,'\ufeff'+rows.map(r=>r.map(v=>'"'+v.replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}async function importJSON(input){let file=input.files?.[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.entries))throw Error('格式错误');let ids=new Set(state.entries.map(e=>e.id)),count=0;for(let e of data.entries){if(!e.id||!MODULES.some(m=>m.id===e.module)||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||!Number.isFinite(e.minutes)||e.minutes<=0||e.minutes>1440||ids.has(e.id))continue;state.entries.push({...e,notes:String(e.notes||'')});ids.add(e.id);count++}save();notify(`成功导入 ${count} 条记录`)}catch(e){alert('导入失败：请使用PTE Timer导出的JSON文件')}}
function render(){if(!['entry','history','home','train','progress','goals','playbook'].includes(page))page='home';$('dateBadge').textContent=new Date().toLocaleDateString('zh-CN',{month:'short',day:'numeric'});$('content').innerHTML=(flash?`<div class="alert">${escapeHTML(flash)}</div>`:'')+({home,train,progress,goals,playbook,history,entry}[page])();nav()}setInterval(()=>{if(page==='train'&&state.timer.mode==='running'){let ms=activeMs();if($('timerDisplay'))$('timerDisplay').textContent=format(ms/1000);if($('timerRing'))$('timerRing').style.setProperty('--pct',Math.min(100,ms/(15*60000)*100)+'%')}},500);render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
